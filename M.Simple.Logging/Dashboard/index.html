<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日志工作台 · M.Helper</title>
<style>
:root{--bg:#f4f6fa;--ink:#1c2940;--muted:#728099;--line:#e5eaf2;--blue:#4263eb;--red:#dc485c;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px 14px}button:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--blue);color:white;border-color:var(--blue)}header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:12px}header strong{font-size:19px;letter-spacing:-.5px}.brand{display:flex;gap:12px;align-items:center}.mark{background:var(--blue);color:#fff;border-radius:10px;width:34px;height:34px;text-align:center;line-height:34px;font-weight:750}.meta{color:var(--muted);font-size:12px}main{max-width:1500px;margin:28px auto;padding:0 28px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px}h1{font-size:26px;margin:0 0 2px;letter-spacing:-.8px}h2{font-size:16px;margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:20px 24px;text-align:left}.card span{color:var(--muted);font-size:13px}.card b{display:block;font-size:32px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}.card.error b{color:var(--red)}.panel{margin-top:22px;overflow:hidden}.panel-head{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.filters{display:flex;flex-wrap:wrap;gap:10px;padding:18px 22px;background:#fbfcfe;align-items:end}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}input:focus,select:focus{outline:2px solid #dce3ff;border-color:var(--blue)}input[type=search]{width:230px}.trace{width:190px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;table-layout:fixed}th{font-size:12px;font-weight:500;color:var(--muted);padding:12px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:13px 20px;border-bottom:1px solid #f0f2f7;vertical-align:top;font-size:13px}tbody tr{cursor:pointer}tbody tr:hover{background:#f8faff}.time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.message{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.category{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.badge{font-size:10px;font-weight:650;padding:4px 8px;border-radius:5px;background:#edf2ff;color:var(--blue);display:inline-block}.level-3{background:#fff5dc;color:#a87500}.level-4,.level-5{background:#ffedf0;color:#cc3752}.level-0,.level-1{background:#eff1f5;color:#778296}.footer{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;color:var(--muted);font-size:12px}.status{font-size:12px;color:var(--muted);margin-top:16px;display:flex;gap:16px;flex-wrap:wrap}.notice{background:#fff0f0;color:#ac2b40;border:1px solid #ffd6dc;padding:10px 16px;border-radius:8px;margin-bottom:16px}.empty{text-align:center;padding:45px;color:var(--muted)}dialog{position:fixed;left:auto;right:0;top:0;margin:0;height:100dvh;max-height:100dvh;width:min(720px,95vw);max-width:95vw;border:0;border-left:1px solid var(--line);padding:0;color:var(--ink);background:#fff;box-shadow:-15px 0 60px #182b451a}dialog::backdrop{background:#182b4540}.detail-head{padding:22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.detail-body{padding:22px}.detail-body h3{font-size:12px;color:var(--muted);margin:24px 0 8px;font-weight:500}pre{font:12px/1.8 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fc;padding:14px;border-radius:8px;border:1px solid var(--line);margin:0}.details-grid{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:12px;overflow-wrap:anywhere}.details-grid span:nth-child(odd){color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center}.check{font-size:12px;color:var(--muted)}@media(max-width:760px){header{padding:0 18px}main{padding:0 14px;margin:20px auto}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:16px}.card b{font-size:27px}.meta{display:none}.heading{align-items:start}h1{font-size:22px}.filters{padding:14px}.field{flex:1;min-width:140px}.field input{width:100%}table{min-width:680px}.toolbar{flex-wrap:wrap;justify-content:end}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">M</div><strong>日志工作台</strong><span class="meta">M.Simple.Logging</span></div><span class="meta" id="lastUpdated">正在连接…</span></header>
<main>
<div class="heading"><div><h1>运行概览</h1><span class="meta">从一条日志，找到问题的起点。</span></div><div class="toolbar"><label class="check"><input type="checkbox" id="autoRefresh"> 每 10 秒刷新</label><button id="refresh">↻ 刷新</button></div></div>
<div id="notice" class="notice" role="alert" hidden></div>
<div id="storageNotice" class="notice" role="status" aria-live="polite" hidden></div>
<section class="cards" aria-label="日志统计">
<button class="card" data-card="all"><span>保留期内日志</span><b id="total">—</b></button>
<button class="card" data-card="today"><span>今日日志</span><b id="today">—</b></button>
<button class="card error" data-card="errors"><span>今日错误 · 含严重错误</span><b id="todayErrors">—</b></button>
<button class="card" data-card="hour"><span>最近一小时</span><b id="lastHour">—</b></button>
</section>
<section class="panel"><div class="panel-head"><h2>日志明细</h2><span class="meta">点击一行查看完整上下文</span></div>
<form id="filters" class="filters">
<div class="field"><label for="from">开始时间</label><input id="from" type="datetime-local"></div>
<div class="field"><label for="to">结束时间</label><input id="to" type="datetime-local"></div>
<div class="field"><label for="level">日志级别</label><select id="level"><option value="">全部级别</option value="0">Trace</option><option value="1">Debug</option><option value="2">Information</option><option value="3">Warning</option><option value="errors">Error + Critical</option><option value="4">Error</option><option value="5">Critical</option></select></div>
<div class="field"><label for="keyword">关键词 · 消息 / 异常 / 属性</label><input id="keyword" type="search" maxlength="500" placeholder="输入订单号、异常信息…"></div>
<div class="field"><label for="category">日志来源（精确匹配）</label><input id="category" maxlength="500" placeholder="例如 Sample.OrderService"></div>
<div class="field"><label for="traceId">TraceId</label><input class="trace" id="traceId" maxlength="128" placeholder="关联同一次请求"></div>
<button class="primary" type="submit">查询</button><button type="button" id="resetFilters">重置</button>
</form>
<div class="table-wrap"><table><thead><tr><th style="width:185px">发生时间</th><th style="width:125px">级别</th><th>消息 / 来源</th><th style="width:150px">TraceId</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="footer"><span id="pageInfo">正在加载…</span><div class="toolbar"><button id="prev" disabled>上一页</button><button id="next" disabled>下一页</button></div></div>
</section>
<div class="status" id="status" aria-live="polite"></div>
</main>
<dialog id="detail" aria-label="日志详情"><div class="detail-head"><h2>日志详情 <span class="meta" id="detailId"></span></h2><div class="toolbar"><button id="copy">复制 JSON</button><button id="close">关闭 ✕</button></div></div><div class="detail-body"><div class="details-grid" id="detailMeta"></div><button id="related" style="margin-top:16px" hidden>查看同一 TraceId 的日志</button><h3>消息</h3><pre id="detailMessage"></pre><h3>消息模板</h3><pre id="detailTemplate"></pre><h3>异常堆栈</h3><pre id="detailException"></pre><h3>结构化属性</h3><pre id="detailProperties"></pre><h3>作用域 Scope</h3><pre id="detailScopes"></pre></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),levels=['Trace','Debug','Information','Warning','Error','Critical'];
// 使用当前页面路径计算 API 地址，兼容宿主 PathBase 和 /logs 两种尾斜杠形式。
const base=location.pathname.replace(/\/$/,'');
let cursors=[null],page=0,nextCursor=null,busy=false,current=null,activeQuery=new URLSearchParams();
function text(tag,value,className){const n=document.createElement(tag);n.textContent=value??'';if(className)n.className=className;return n;}
function date(value){return new Date(value).toLocaleString();}
function localInput(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function pretty(value){try{return JSON.stringify(JSON.parse(value),null,2)}catch{return value}}
function bytes(value){if(value==null)return '未知';return (value/1048576).toLocaleString(undefined,{maximumFractionDigits:1})+' MiB';}
function showStatus(status){
 $('status').replaceChildren(...['已接收 '+status.accepted.toLocaleString(),'已保存 '+status.persisted.toLocaleString(),'丢弃 '+status.dropped.toLocaleString(),'写入失败次数 '+status.writeFailures,'采集失败 '+status.captureFailures,'写入器 '+(status.isWriting?'运行中':'已停止')].map(x=>text('span',x)));
 if(status.lastError)$('status').append(text('span','最近存储错误：'+status.lastError));
 showStorage(status.storage);
}
function showStorage(storage){
 $('storageNotice').hidden=!storage?.isPaused;
 if(!storage)return;
 $('status').append(...['日志存储 '+bytes(storage.totalBytes)+' / '+bytes(storage.maxStorageBytes),'磁盘可用 '+bytes(storage.availableDiskBytes),'容量清理 '+storage.prunedLogs.toLocaleString()+' 条'].map(x=>text('span',x)));
 if(storage.isPaused){
  const reasons={LowDiskSpace:'磁盘可用空间不足',DiskSpaceUnavailable:'无法检查磁盘可用空间',StorageLimit:'日志存储已达到容量限制',CheckpointBusy:'存储空间回收暂时受阻',BatchTooLarge:'单条日志超出容量预算',StorageFull:'存储空间不足',StorageCheckFailed:'日志存储检查失败'};
  $('storageNotice').textContent=(reasons[storage.pauseReason]||'日志存储暂时不可用')+'，已暂停保存日志并定期检查恢复。暂停期间的新日志会被丢弃并计数。';
 }
}
async function api(path){const r=await fetch(base+'/api/'+path,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(r.status===401||r.status===403?'无权访问日志，请先登录并确认权限。':'请求失败（'+r.status+'），请检查服务状态或筛选条件。');if(!r.headers.get('content-type')?.includes('application/json'))throw new Error('会话可能已过期，请重新登录。');return r.json();}
function setError(e){$('notice').textContent=e.message;$('notice').hidden=false;}
function captureFilters(){const q=new URLSearchParams();for(const id of ['from','to']){if($(id).value)q.set(id,new Date($(id).value).toISOString());}for(const id of ['level','keyword','traceId','category'])if($(id).value)q.set(id,$(id).value);if(q.get('level')==='errors'){q.delete('level');q.set('minimumLevel','4');}return q;}
async function refresh(reset=false){
 if(busy)return;busy=true;
 if(reset){page=0;cursors=[null];activeQuery=captureFilters();}
 $('refresh').disabled=true;$('prev').disabled=true;$('next').disabled=true;
 try{
  const q=new URLSearchParams(activeQuery);q.set('pageSize','50');if(cursors[page])q.set('beforeId',cursors[page]);
  const [logs,stats,status]=await Promise.all([api('logs?'+q),api('statistics?utcOffsetMinutes='+(-new Date().getTimezoneOffset())),api('status')]);
  $('notice').hidden=true;nextCursor=logs.nextBeforeId;
  for(const id of ['total','today','todayErrors','lastHour'])$(id).textContent=stats[id].toLocaleString();
  $('rows').replaceChildren();
  for(const entry of logs.items){const tr=document.createElement('tr');tr.tabIndex=0;tr.setAttribute('aria-label','查看日志 '+entry.id);tr.append(text('td',date(entry.timestampUtc),'time'));const level=text('td','');level.append(text('span',levels[entry.level]??entry.level,'badge level-'+entry.level));tr.append(level);const message=text('td','');message.append(text('div',entry.message,'message'),text('div',entry.category,'category'));tr.append(message,text('td',entry.traceId?.slice(0,12)||'—','time'));tr.onclick=()=>showDetail(entry.id);tr.onkeydown=e=>{if(e.key==='Enter')showDetail(entry.id)};$('rows').append(tr);}
  if(!logs.items.length){const tr=document.createElement('tr'),td=text('td','当前条件下暂无日志','empty');td.colSpan=4;tr.append(td);$('rows').append(tr);}
  $('pageInfo').textContent='第 '+(page+1)+' 页 · 本页 '+logs.items.length+' 条';
  showStatus(status);
  $('lastUpdated').textContent='更新于 '+new Date().toLocaleTimeString();
 }catch(e){setError(e);try{showStatus(await api('status'))}catch{}}finally{busy=false;$('refresh').disabled=false;$('prev').disabled=page===0;$('next').disabled=!nextCursor;}
}
async function showDetail(id){try{current=await api('logs/'+id);$('detailId').textContent='#'+current.id;$('detailMeta').replaceChildren();for(const [label,value]of [['发生时间',date(current.timestampUtc)],['级别',levels[current.level]],['来源',current.category],['应用',current.applicationName],['实例',current.instanceId],['EventId',current.eventId+(current.eventName?' / '+current.eventName:'')],['TraceId',current.traceId||'—'],['SpanId',current.spanId||'—']])$('detailMeta').append(text('span',label),text('span',value));$('detailMessage').textContent=current.message;$('detailTemplate').textContent=current.messageTemplate||'—';$('detailException').textContent=current.exception||'无异常';$('detailProperties').textContent=pretty(current.propertiesJson);$('detailScopes').textContent=pretty(current.scopesJson);$('related').hidden=!current.traceId;if(!$('detail').open)$('detail').showModal();}catch(e){setError(e)}}
$('filters').onsubmit=e=>{e.preventDefault();refresh(true)};$('refresh').onclick=()=>refresh(true);
$('resetFilters').onclick=()=>{if(busy)return;$('filters').reset();$('from').value=localInput(new Date(Date.now()-86400000));refresh(true)};
$('prev').onclick=()=>{if(!busy&&page>0){page--;refresh()}};$('next').onclick=()=>{if(!busy&&nextCursor){cursors[++page]=nextCursor;refresh()}};
$('close').onclick=()=>$('detail').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(current,null,2));$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制 JSON',1500)}catch{setError(new Error('浏览器不允许复制，请手动选择详情文本。'))}};
$('related').onclick=()=>{if(busy)return;$('filters').reset();$('traceId').value=current.traceId;$('detail').close();refresh(true)};
document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(busy)return;$('filters').reset();const type=b.dataset.card;if(type==='today'||type==='errors'){const d=new Date();d.setHours(0,0,0,0);$('from').value=localInput(d);}if(type==='errors'){$('keyword').value='';$('level').value='errors';}if(type==='hour')$('from').value=localInput(new Date(Date.now()-3600000));refresh(true);});
setInterval(()=>{if($('autoRefresh').checked&&!$('detail').open&&page===0&&!document.hidden)refresh();},10000);
$('from').value=localInput(new Date(Date.now()-86400000));activeQuery=captureFilters();refresh();
</script>
</body>
</html>
